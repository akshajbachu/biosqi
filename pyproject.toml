[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "biosqi"
version = "0.1.0"
description = "Transparent, calibrated signal-quality assessment for biomedical recordings"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Akshaj Bachu" }]
maintainers = [{ name = "Akshaj Bachu" }]
keywords = ["ecg", "ppg", "eeg", "signal-quality", "biosignals", "physionet"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Intended Audience :: Healthcare Industry",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Medical Science Apps.",
  "Topic :: Scientific/Engineering :: Information Analysis",
  "Typing :: Typed",
]
dependencies = [
  "numpy>=1.26",
  "scipy>=1.12",
  "scikit-learn>=1.4",
  "typer>=0.12",
  "rich>=13.7",
]

[project.optional-dependencies]
data = ["wfdb>=4.1", "pyedflib>=0.1.39", "neurokit2>=0.2.10"]
ui = ["fastapi>=0.115", "uvicorn[standard]>=0.30", "python-multipart>=0.0.12"]
docs = ["mkdocs-material>=9.5", "mkdocstrings[python]>=0.25"]
dev = [
  "biosqi[data,ui,docs]",
  "build>=1.2",
  "hatchling>=1.27",
  "httpx>=0.27",
  "hypothesis>=6.100",
  "mypy>=1.11",
  "pytest>=8.2",
  "pytest-cov>=5",
  "ruff>=0.6",
]

[project.scripts]
biosqi = "biosqi.cli:app"

[project.urls]
Homepage = "https://github.com/akshajbachu/biosqi"
Documentation = "https://akshajbachu.github.io/biosqi"
Source = "https://github.com/akshajbachu/biosqi"
Issues = "https://github.com/akshajbachu/biosqi/issues"
Changelog = "https://github.com/akshajbachu/biosqi/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/biosqi"]
artifacts = ["src/biosqi/server/static/**", "src/biosqi/models/*.json"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_unreachable = true
packages = ["biosqi"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["scipy.*", "sklearn.*", "wfdb.*", "pyedflib.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers --cov=biosqi --cov-report=term-missing --cov-fail-under=90"
testpaths = ["tests"]
markers = [
  "integration: tests that exercise multiple application layers",
  "network: tests that download public data",
]

[tool.coverage.run]
branch = true
source = ["biosqi"]

[tool.coverage.report]
exclude_also = [
  "if TYPE_CHECKING:",
  "if __name__ == .__main__.:",
  "raise NotImplementedError",
]
